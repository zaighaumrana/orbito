name: Backend release parity
on:
  pull_request:
    branches: [development]
    paths: ['supabase/**', 'scripts/**', '.github/workflows/backend-parity.yml', 'package.json', 'AGENTS.md']
  push:
    branches: [feature/shop-modernization-m2-release]
    paths: ['supabase/**', 'scripts/**', '.github/workflows/backend-parity.yml', 'package.json', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: orbito
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zaighaumrana/Orbitoshopv2-v1
          # Owner-approved v7 selector, classifier and controlled-upgrade source.
          ref: de98de2788e02601445e632e9337d52e8095d9c5
          path: Orbitoshopv2-v1
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RETRASELL_RELEASE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce approved support-v7 release and both installation plans
        working-directory: orbito
        run: node scripts/release-parity.mjs
