name: Backend release parity
on:
  pull_request:
    branches: [development]
    paths: ['supabase/**', 'scripts/**', '.github/workflows/backend-parity.yml', 'package.json', 'AGENTS.md']
  push:
    branches: [development]
    paths: ['supabase/**', 'scripts/**', '.github/workflows/backend-parity.yml', 'package.json', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: orbito
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zaighaumrana/Orbitoshopv2-v1
          # Immutable compatible Shop snapshot: valid before/during/after merges
          # and feature-branch retirement. This is not backend_source_commit.
          ref: 46fc228b0c4e13a3e4d016012aa0acff5ab9e613
          path: Orbitoshopv2-v1
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RETRASELL_RELEASE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify approved support-v9 and supported historical releases
        working-directory: orbito
        run: node scripts/release-parity.mjs
